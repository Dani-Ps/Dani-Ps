<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Daniel Pérez Serrano — Full-Stack Developer &amp; AI Builder">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="glow-cyan-l" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 40) rotate(25) scale(340 190)">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-indigo-l" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 195) rotate(-15) scale(320 180)">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-line-l" x1="48" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <pattern id="dots-light" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="card-clip-l">
      <rect x="1" y="1" width="898" height="218" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-l)">
    <rect x="0" y="0" width="900" height="220" fill="url(#bg-light)"/>
    <rect x="0" y="0" width="900" height="220" fill="url(#dots-light)"/>
    <rect x="0" y="0" width="900" height="220" fill="url(#glow-cyan-l)"/>
    <rect x="0" y="0" width="900" height="220" fill="url(#glow-indigo-l)"/>
    <rect x="0" y="0" width="900" height="3" fill="url(#accent-line-l)"/>

    <!-- Status pill -->
    <rect x="48" y="34" width="272" height="26" rx="13" fill="#e0f2fe" fill-opacity="0.7" stroke="#0284c7" stroke-opacity="0.28"/>
    <circle cx="64" cy="47" r="4" fill="#10b981"/>
    <text x="76" y="51" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">SEVILLA, ES · BUILDING WITH AI</text>

    <!-- Main headline -->
    <text x="48" y="106" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8">Daniel Pérez Serrano</text>

    <!-- Subtitle -->
    <text x="48" y="138" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500">Full-Stack Developer &amp; AI Builder</text>

    <!-- Code tagline chip -->
    <rect x="48" y="158" width="144" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="62" y="176" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">Just &lt;code&gt; it;</text>

    <!-- Right code card -->
    <rect x="526" y="34" width="326" height="152" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M526 46 C526 39.373 531.373 34 538 34 H840 C846.627 34 852 39.373 852 46 V62 H526 V46 Z" fill="#f8fafc"/>
    <line x1="526" y1="62" x2="852" y2="62" stroke="#e2e8f0"/>

    <!-- Window controls -->
    <circle cx="545" cy="48" r="4" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="559" cy="48" r="4" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="573" cy="48" r="4" fill="#10b981" fill-opacity="0.8"/>
    <text x="689" y="52" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">dani-ps.ts</text>

    <!-- Code lines -->
    <text x="546" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> dani = {</tspan></text>
    <text x="562" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5"><tspan fill="#0284c7">focus</tspan><tspan fill="#64748b">: </tspan><tspan fill="#059669">"Full-Stack &amp; AI"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="562" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5"><tspan fill="#0284c7">building</tspan><tspan fill="#64748b">: [</tspan><tspan fill="#b45309">"Oxel"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#b45309">"GastroAI"</tspan><tspan fill="#64748b">],</tspan></text>
    <text x="562" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5"><tspan fill="#0284c7">stack</tspan><tspan fill="#64748b">: [</tspan><tspan fill="#059669">"TS"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#059669">"Java"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#059669">"Python"</tspan><tspan fill="#64748b">],</tspan></text>
    <text x="546" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5"><tspan fill="#0f172a">};</tspan></text>
  </g>

  <rect x="1" y="1" width="898" height="218" rx="16" stroke="#d0d7de" stroke-width="1.2"/>
</svg>
